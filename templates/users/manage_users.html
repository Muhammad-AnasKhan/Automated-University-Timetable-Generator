{% extends 'base.html' %}

{% block content %}
    <form method="post" id="teacher-preference-form">
        {% csrf_token %}
        <fieldset>
            <div class="tabcontent" id="new">
                {#        {{ form.as_p }}#}
                <p><label for="id_section">Section:</label> <select name="section" required="" id="id_section">
                    <option value="" selected="">---------</option>
                    {% for class in classes %}
                        <option value="{{ class.section_id }}">{{ class.section_id }}</option>
                        {{ class.section_id }}
                    {% endfor %}


                </select></p>
                <p><label for="id_course">Course:</label> <select name="course" required="" id="id_course">
                    <option value="" selected="">---------</option>


                </select></p>
                <p><label for="id_weekday">Weekday:</label> <select name="weekday" required="" id="id_weekday">
                    <option value="" selected="">---------</option>
                    {% for day in week_days %}
                        <option value="{{ day }}">{{ day }}</option>
                    {% endfor %}


                </select></p>
                <p><label for="id_timeslot">Timeslot:</label> <select name="timeslot" required="" id="id_timeslot">
                    <option value="" selected="">---------</option>
                    {#                    {% for t in time_slots %}#}
                    {#                        <option value="{{ t.pid }}">{{ t.time }}</option>#}
                    {#                    {% endfor %}#}


                </select><input type="hidden" value="1" name="teacher" id="id_teacher"></p>
                <button type="submit" class="submit">Save</button>
            </div>
        </fieldset>
    </form>
{% endblock %}
