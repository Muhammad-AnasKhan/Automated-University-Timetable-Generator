{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Forgot Password</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="DSC AISSMSCOE">
  <meta name="description" content="Login">
  <link rel="shortcut icon" href="{% static 'img/logo.png' %}" type="image/x-icon">

  <!-- Source Sans Pro -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.5.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="{% static 'CSS/login.css' %}">

  <style>
    img {
      max-width: 50%;
    }
  </style>
</head>

<body>
  <form method="post" id="form1">
    {% csrf_token %}
    <div id="divLOGINPAGE" class="sr">
      <div class="login-box-body">
        <div class="row">
          <div class="col">
            <div class="text-center loginLeft">
              <h4 class="logWelC">WELCOME TO </h4>
              <img class="logoLogin" src="{% static 'img/logo.png' %}">
              <h3 class="Alignment">
                <center><strong>Automated University Timetable Scheduler</strong></center>
              </h3>


            </div>
          </div>
          <div class="col">
            <div class="loginRight">
              <h3><strong>Forgot Password? </strong></h3>
              <div class="form-group has-feedback">
                {% comment %} {{ form.username }} {% endcomment %}
                <input placeholder="Enter Email" />
                <span class="glyphicon glyphicon-user  form-control-feedback"></span>
              </div>
              {% comment %} <div class="form-group has-feedback">
                {{ form.password }}
                <span class="glyphicon glyphicon-lock form-control-feedback"></span>
                {% if form.errors %}
                    <br>
                <span class="lblnote">Invalid User Name Or Password.</span>
                {% endif %}
              </div> {% endcomment %}
              <button type="submit" class="btn btn-info"><span class="fa fa-unlock-alt"></span>&nbsp;Reset</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
<script>
    document.addEventListener('DOMContentLoaded', ()=>{
        inputs = document.querySelectorAll('input')
        inputs.forEach(input => {
            input.classList.add('form-control')
        })
    })
</script>
</body>

</html>
